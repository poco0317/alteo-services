<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" 
   xmlns:sec = "http://www.thymeleaf.org/extras/spring-security"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout}">

	<head>
		<title>Not EtternaOnline</title>	
	</head>
	
<body>

	<div layout:fragment="content">
		<div class="container-fluid">
			<div class="row">
				<div class="col-md-12 text-center">
					<h1><a th:text="${score.songname + ' - ' + score.difficulty}" th:href="@{/chart/{ck}(ck=${score.chartkey})}"></a></h1>
					<h3 th:text="${#numbers.formatDecimal(score.rate, 1, 2) + 'x'}"></h3>
					<h5 th:text="${#numbers.formatDecimal(score.wifescore * 100.0, 2, 4) + '%'}"></h5>
					<h6><a th:text="${'By: ' + user.username}" th:href="@{/user/{user}(user=${user.username})}"></a></h6>
					<h6 th:text="${'Date: ' + score.datetime}"></h6>
					<h6 th:text="${'Mods: ' + score.modifiers}"></h6>
					<!-- 
					<h6>Packs:</h6>
					<h6 th:each="pack, stat: ${packs}"><a th:text="${pack.displayName}" th:href="@{/packs/{pack}(pack=${pack.name})}"></a></h6>
					-->
				</div>
			</div>

			<div class="row" style="margin-top: 5vh;">
				<div class="col-md-12 text-center">
					<h6 th:text="${'Overall: ' + #numbers.formatDecimal(score.overall, 2, 2)}"></h6>
					<h6 th:text="${'Stream: ' + #numbers.formatDecimal(score.stream, 2, 2)}"></h6>
					<h6 th:text="${'Jumpstream: ' + #numbers.formatDecimal(score.jumpstream, 2, 2)}"></h6>
					<h6 th:text="${'Handstream: ' + #numbers.formatDecimal(score.handstream, 2, 2)}"></h6>
					<h6 th:text="${'Stamina: ' + #numbers.formatDecimal(score.stamina, 2, 2)}"></h6>
					<h6 th:text="${'Jackspeed: ' + #numbers.formatDecimal(score.jackSpeed, 2, 2)}"></h6>
					<h6 th:text="${'Chordjack: ' + #numbers.formatDecimal(score.chordjack, 2, 2)}"></h6>
					<h6 th:text="${'Technical: ' + #numbers.formatDecimal(score.technical, 2, 2)}"></h6>
				</div>
			</div>
			
			<div class="row" style="margin-top: 2vh;">
				<div class="container">
				
					<h5>Judgments</h5>
					<a th:text="${'Marvelous: '+score.marv}"></a><br>
					<a th:text="${'Perfect: '+score.perfect}"></a><br>
					<a th:text="${'Great: '+score.great}"></a><br>
					<a th:text="${'Good: '+score.good}"></a><br>
					<a th:text="${'Bad: '+score.bad}"></a><br>
					<a th:text="${'Miss: '+score.miss}"></a><br>
					
					<br>
					<a th:text="${'Holds Held: '+score.held}"></a><br>
					<a th:text="${'Holds Dropped: '+score.letgo}"></a><br>
					<a th:text="${'Holds Missed: '+score.missedhold}"></a><br>
					
					<br>
					<a th:text="${'Mines Hit: '+score.hitmine}"></a><br>
					
					<br><br>
					
					<h5>Extra Info</h5>
					<a th:text="${'Max Combo: '+score.maxcombo}"></a><br>
					<!-- <a th:text="${'Grade: '+score.grade}"></a><br> -->
					<a th:text="${'WifeGrade: '+score.wifeGrade}"></a><br>
					<a th:text="${'WifeVersion: '+score.wifeversion}"></a><br>
					<!-- <a th:text="${'WifePoints: '+score.wifePoints}"></a><br> -->
					<!-- <a th:text="${'Original WifePercent: '+score.hsUnion.wifePercent}"></a><br> -->
					<!-- <a th:text="${'Judge Scale: '+score.hsUnion.judgeScale}"></a><br> -->
					<!-- <a th:text="${'TopScore: '+score.topScore}"></a><br> -->
					<a th:text="${'EtternaValid: '+score.valid}"></a><br>
					<!-- <a th:text="${'NegBPM: '+score.negBpm}"></a><br> -->
					<a th:text="${'NoCC: '+score.nocc}"></a><br>
					
					<br><br>
					
					<!-- <div sec:authorize="hasAuthority('ROLE_ADMIN')"> -->
						<h5>Secret Info</h5>
						<a th:text="${'Brittle Key: '+score.validationKey}"></a><br>
						<a th:text="${'GUID: '+score.machineGuid}"></a><br>
						<!-- <a th:text="${'Nerf Multiplier: '+score.nerfMultiplier}"></a><br> -->
						<!-- <a th:text="${'Admin Invalidation: '+score.hsUnion.manuallyInvalid}"></a><br> -->
					<!-- </div> -->
				</div>
			</div>
		</div>
	</div>

	
</body>
</html>
