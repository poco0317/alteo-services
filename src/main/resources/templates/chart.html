<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" 
   xmlns:sec = "http://www.thymeleaf.org/extras/spring-security"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout}">

	<head>
		<title>Not EtternaOnline</title>	
	</head>
	
<body>

	<div layout:fragment="content">
		<div class="container-fluid">
			<div class="row">
				<div class="col-md-12 text-center">
					<h1 th:text="${chart.chart.title + ' - ' + chart.chart.difficulty}"></h1>
					<h5 th:text="${'Overall: ' + #numbers.formatDecimal(chart.overall, 2, 2)}"></h5>
					<h5 th:text="${'Stream: ' + #numbers.formatDecimal(chart.stream, 2, 2)}"></h5>
					<h5 th:text="${'Jumpstream: ' + #numbers.formatDecimal(chart.jumpstream, 2, 2)}"></h5>
					<h5 th:text="${'Handstream: ' + #numbers.formatDecimal(chart.handstream, 2, 2)}"></h5>
					<h5 th:text="${'Stamina: ' + #numbers.formatDecimal(chart.stamina, 2, 2)}"></h5>
					<h5 th:text="${'Jackspeed: ' + #numbers.formatDecimal(chart.jackspeed, 2, 2)}"></h5>
					<h5 th:text="${'Chordjack: ' + #numbers.formatDecimal(chart.chordjack, 2, 2)}"></h5>
					<h5 th:text="${'Technical: ' + #numbers.formatDecimal(chart.technical, 2, 2)}"></h5>
					<h3>Packs:</h3>
					<h5 th:each="pack, stat: ${packs}"><a th:text="${pack.displayName}" th:href="@{/packs/{pack}(pack=${pack.name})}"></a></h5>
				</div>
			</div>

			<div class="row" style="margin-top: 5vh;">
				<ul th:if="${maxPage > 1}" th:object="${user}" class="pagination justify-content-end">
					<li th:if="${currentPage > 1}" class="page-item">
						<a class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort=${currentSort})}">First</a>
					</li>
					<li th:if="${currentPage > 1}"
						class="page-item"><a class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${currentPage - 1}, sort=${currentSort})}">Prev</a>
					</li>
					<li th:each="page: ${pageRange}" class="page-item"
						th:classappend="${page == currentPage} ? active"><a
						class="page-link" th:text="${page}"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${page}, sort=${currentSort})}"></a>
					</li>
					<li th:if="${maxPage != currentPage}" class="page-item"><a
						class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${currentPage + 1}, sort=${currentSort})}">Next</a>
					</li>
					<li th:if="${maxPage != currentPage}"
						class="page-item"><a class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${maxPage}, sort=${currentSort})}">Last</a>
					</li>
				</ul>
				<table th:if="${#lists.size(scores) > 0}" class="table table-hover table-sm">
				
				<!-- header -->
				<thead>
					<tr>
						<th scope="col">#</th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='PLAYER')}">Player Name</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='RATE')}">Rate</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='PERCENT')}">Percent</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='DATE')}">Date</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='OVERALL')}">Overall</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='STREAM')}">Stream</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='JUMPSTREAM')}">Jumpstream</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='HANDSTREAM')}">Handstream</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='STAMINA')}">Stamina</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='JACKSPEED')}">Jackspeed</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='CHORDJACK')}">Chordjack</a></th>
						<th scope="col"><a th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort='TECHNICAL')}">Technical</a></th>
					</tr>
				</thead>
				
				<!-- The Business. -->
				<tbody>
					<tr th:each="score, stat: ${scores}">
						<th scope="row" th:text="${stat.index + 1 + ((currentPage-1) * 200)}"></th>
						<td><a th:text="${score.user.username}" th:href="@{/user/{username}(username=${score.user.username})}"></a></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.score.musicRate / 100.0, 1, 2) + 'x'}"></td>
						<td><a th:text="${#numbers.formatDecimal(score.hsUnion.score.ssrNorm / 10000.0, 2, 4) + '%'}" th:href="@{/score/{scorekey}(scorekey=${score.hsUnion.score.scoreKey})}"></a></td>
						<td th:text="${score.hsUnion.score.dateStr}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.overall, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.stream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.jumpstream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.handstream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.stamina, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.jackspeed, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.chordjack, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.hsUnion.technical, 2, 2)}"></td>
					</tr>
				</tbody>
				
				</table>
				<div class="container"  th:unless="${#lists.size(scores) > 0}">
					<h3>There are no scores...</h3>
				</div>
			</div>
		</div>
	</div>

	
</body>
</html>
