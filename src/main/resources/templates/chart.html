<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" 
   xmlns:sec = "http://www.thymeleaf.org/extras/spring-security"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout}">

	<head>
		<title>Not EtternaOnline</title>	
	</head>
	
<body>

	<div layout:fragment="content">
		<div class="container-fluid">
			<div class="row">
				<div class="col-md-12 text-center">
					<h1 th:text="${chart.songname + ' - ' + chart.difficulty}"></h1>
					<h5 th:text="${'Overall: ' + #numbers.formatDecimal(chart.msd, 2, 2)}"></h5>
					<h3>Packs:</h3>
					<h5 th:each="pack, stat: ${packs}"><a th:text="${pack.packname}" th:href="@{/packs/{pack}(pack=${pack.packname})}"></a></h5>
				</div>
			</div>

			<div class="row" style="margin-top: 5vh;">
			
				<!-- 
				<ul th:if="${maxPage > 1}" th:object="${user}" class="pagination justify-content-end">
					<li th:if="${currentPage > 1}" class="page-item">
						<a class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=1, sort=${currentSort})}">First</a>
					</li>
					<li th:if="${currentPage > 1}"
						class="page-item"><a class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${currentPage - 1}, sort=${currentSort})}">Prev</a>
					</li>
					<li th:each="page: ${pageRange}" class="page-item"
						th:classappend="${page == currentPage} ? active"><a
						class="page-link" th:text="${page}"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${page}, sort=${currentSort})}"></a>
					</li>
					<li th:if="${maxPage != currentPage}" class="page-item"><a
						class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${currentPage + 1}, sort=${currentSort})}">Next</a>
					</li>
					<li th:if="${maxPage != currentPage}"
						class="page-item"><a class="page-link"
						th:href="@{/chart/{chartkey}(chartkey=${chart.chart.chartKey}, page=${maxPage}, sort=${currentSort})}">Last</a>
					</li>
				</ul>
				-->
				<table th:if="${#lists.size(scores) > 0}" class="table table-hover table-sm sortable-theme-bootstrap" data-sortable>
				
				<!-- header -->
				<thead>
					<tr>
						<th scope="col">#</th>
						<th scope="col">Player Name</th>
						<th scope="col">>Rate</th>
						<th scope="col">Percent</th>
						<th scope="col">Date</th>
						<th scope="col">Overall</th>
						<th scope="col">Stream</th>
						<th scope="col">Jumpstream</th>
						<th scope="col">Handstream</th>
						<th scope="col">Stamina</th>
						<th scope="col">Jackspeed</th>
						<th scope="col">Chordjack</th>
						<th scope="col">Technical</th>
					</tr>
				</thead>
				
				<!-- The Business. -->
				<tbody>
					<tr th:each="score, stat: ${scores}">
						<th scope="row" th:text="${stat.index + 1 + ((currentPage-1) * 200)}"></th>
						<td><a th:text="${score.username}" th:href="@{/user/{username}(username=${score.username})}"></a></td>
						<td th:text="${#numbers.formatDecimal(score.rate, 1, 2) + 'x'}"></td>
						<td><a th:text="${#numbers.formatDecimal(score.wifescore * 100.0, 2, 4) + '%'}" th:href="@{/userscores/{username}/{scorekey}(username=${score.username}, scorekey=${score.scorekey})}"></a></td>
						<td th:text="${score.datetime}"></td>
						<td th:text="${#numbers.formatDecimal(score.overall, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.stream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.jumpstream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.handstream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.stamina, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.jackSpeed, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.chordjack, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.technical, 2, 2)}"></td>
					</tr>
				</tbody>
				
				</table>
				<div class="container"  th:unless="${#lists.size(scores) > 0}">
					<h3>There are no scores...</h3>
				</div>
			</div>
		</div>
	</div>

	
</body>
</html>
