<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" 
   xmlns:sec = "http://www.thymeleaf.org/extras/spring-security"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout}">

	<head>
		<title>Not EtternaOnline</title>	
	</head>

<body>

	<div layout:fragment="content">
		<div class="container">
			<div class="row">
				<div class="col-md-12 text-center">
					<h1>Register</h1>
					<h6>(or <a th:href="@{/login}">Log In</a>)</h6>
				</div>
			</div>
			
			<div class="row">
				<h2 th:if="${param.mismatch}">Password does not match Confirmation.</h2>
				<h2 th:if="${param.badpass}">Password was empty.</h2>
				<h2 th:if="${param.baduser}">Username was empty.</h2>
			</div>
			
			<div class="row">
				<form th:action="@{/register}" method="post" th:object="${userinfo}">
					<div>
						<label> User Name : <input th:field="*{username}" required type="text"/>
						</label>
					</div>
					<div>
						<label> Password: <input th:field="*{password}" required type="password"/>
						</label>
					</div>
					<div>
						<label> Confirm Password: <input th:field="*{confirmedPassword}" required type="password"/>
						</label>
					</div>
					<div>
						<input type="submit" value="Create Account"/>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
