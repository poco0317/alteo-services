<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" 
   xmlns:sec = "http://www.thymeleaf.org/extras/spring-security"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout}">

	<head>
		<title>Not EtternaOnline</title>	
	</head>
	
<body>

	<div layout:fragment="content">
		<div class="container-fluid">
			<div class="row">
				<div class="col-md-12 text-center">
					<h1 th:object="${user}" th:text="${user.username}"></h1>
					
					<h3 th:object="${user}" th:text="${user.aboutme}"></h3>
					
					<h6 th:object="${user}" th:text="${'Overall: ' + #numbers.formatDecimal(user.overall, 2, 2)}"></h6>
					<h6 th:object="${user}" th:text="${'Stream: ' + #numbers.formatDecimal(user.stream, 2, 2)}"></h6>
					<h6 th:object="${user}" th:text="${'Jumpstream: ' + #numbers.formatDecimal(user.jumpstream, 2, 2)}"></h6>
					<h6 th:object="${user}" th:text="${'Handstream: ' + #numbers.formatDecimal(user.handstream, 2, 2)}"></h6>
					<h6 th:object="${user}" th:text="${'Stamina: ' + #numbers.formatDecimal(user.stamina, 2, 2)}"></h6>
					<h6 th:object="${user}" th:text="${'Jackspeed: ' + #numbers.formatDecimal(user.jackSpeed, 2, 2)}"></h6>
					<h6 th:object="${user}" th:text="${'Chordjack: ' + #numbers.formatDecimal(user.chordjack, 2, 2)}"></h6>
					<h6 th:object="${user}" th:text="${'Technical: ' + #numbers.formatDecimal(user.technical, 2, 2)}"></h6>
				</div>
			</div>

			<div th:object="${scores}" class="row" style="margin-top: 5vh;">
			
				<table th:if="${#lists.size(scores) > 0}" class="table table-hover table-sm sortable-theme-bootstrap" data-sortable>
				
				<!-- header -->
				<thead>
					<tr>
						<th scope="col">#</th>
						<th scope="col">Song Name</th>
						<th scope="col" data-sortable="false">Difficulty</th>
						<th scope="col">Rate</th>
						<th scope="col">Percent</th>
						<th scope="col">Date</th>
						<th scope="col">Overall</th>
						<th scope="col">Stream</th>
						<th scope="col">Jumpstream</th>
						<th scope="col">Handstream</th>
						<th scope="col">Stamina</th>
						<th scope="col">Jackspeed</th>
						<th scope="col">Chordjack</th>
						<th scope="col">Technical</th>
					</tr>
				</thead>
				
				<!-- The Business. -->
				<tbody>
					<tr th:each="score, stat: ${scores}">
						<th scope="row" th:text="${stat.index + 1}"></th>
						<td><a th:text="${score.songname}" th:href="@{/chart/{chartkey}(chartkey=${score.chartkey})}"></a></td>
						<td th:text="${score.difficulty}"></td>
						<td th:text="${#numbers.formatDecimal(score.rate, 1, 2) + 'x'}"></td>
						<td><a th:text="${#numbers.formatDecimal(score.wifescore * 100.0, 2, 4) + '%'}" th:href="@{/userscores/{username}/{scorekey}(scorekey=${score.scorekey}, username=${user.username})}"></a></td>
						<td th:text="${score.datetime}"></td>
						<td th:text="${#numbers.formatDecimal(score.overall, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.stream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.jumpstream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.handstream, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.stamina, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.jackSpeed, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.chordjack, 2, 2)}"></td>
						<td th:text="${#numbers.formatDecimal(score.technical, 2, 2)}"></td>
					</tr>
				</tbody>
				
				</table>
				<div class="container"  th:unless="${#lists.size(scores) > 0}">
					<h3>There are no scores...</h3>
				</div>
			</div>
		</div>
	</div>

	
</body>
</html>
