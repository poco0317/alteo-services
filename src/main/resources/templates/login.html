<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" 
   xmlns:sec = "http://www.thymeleaf.org/extras/spring-security"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
   layout:decorate="~{layout}">

	<head>
		<title>Not EtternaOnline</title>	
	</head>

<body>

	<div layout:fragment="content">
		<div class="container">
			<div class="row">
				<div class="col-md-12 text-center">
					<h1>Log In</h1>
					<h6>(or <a th:href="@{/register}">Register</a>)</h6>
				</div>
			</div>
			
			<div class="row">
				<h2 th:if="${param.error}">Error with login. Wrong username or password probably.</h2>
				<h2 th:if="${param.logout}">You have been logged out.</h2>
				<h2 th:if="${param.registered}">Account created! Log in with your credentials.</h2>
			</div>
			
			<div class="row">
				<form th:action="@{/login}" method="post">
					<div>
						<label> User Name : <input type="text" name="username" />
						</label>
					</div>
					<div>
						<label> Password: <input type="password" name="password" />
						</label>
					</div>
					<div>
						<input type="submit" value="Sign In" />
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
